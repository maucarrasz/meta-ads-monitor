name: barrido
on:
  workflow_dispatch:
    inputs:
      solo_lista:
        description: "1 = solo imprimir que se leeria (sin Facebook)"
        default: ""
      por_tanda:
        description: "Dominios por tanda (defecto 30; ~4.4 min por dominio). Tandas en PARALELO: agregar tiendas no alarga la corrida"
        default: "30"
permissions:
  contents: read
  id-token: write
concurrency:
  group: barrido-apps
  cancel-in-progress: false
env:
  SPY_HASTA_HORA: "18"         # manual, solo lecturas diurnas; corte 18:00 Lima
  SPY_MAX_TANDAS: "12"         # hasta 12 tandas x 30 = 360 dominios sin alargar la corrida; si faltan, el plan sale rojo (FALTAN_TANDAS)
  SPY_SHEETS: "BARRIDO:1pfWBv6rkV6ZTGeObrhCVZUEzEUaq6og65Jf-CHi_e7E"
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      n: ${{ steps.p.outputs.n }}
      total: ${{ steps.p.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277394231713/locations/global/workloadIdentityPools/github-meta-ads/providers/github-actions
          service_account: meta-ads-robot@mauricio-ai-hub.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright google-api-python-client google-auth  # solo importar; el plan no abre navegador
      - id: p
        run: python spy.py   # SPY_PLAN=1: cuenta filas activas y calcula tandas; FALTAN_TANDAS si no alcanzan
        env:
          SPY_PLAN: "1"
          SPY_POR_TANDA: ${{ github.event.inputs.por_tanda || '37' }}
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      max-parallel: 12         # tandas en paralelo; cada tanda es un lector lento (240 s/dominio), escalable
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277394231713/locations/global/workloadIdentityPools/github-meta-ads/providers/github-actions
          service_account: meta-ads-robot@mauricio-ai-hub.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright google-api-python-client google-auth
      - run: python -m playwright install --with-deps chromium
      - run: python spy.py
        env:
          SOLO_LISTA: ${{ github.event.inputs.solo_lista }}
          SPY_SHARD: ${{ matrix.shard }}
          SPY_NSHARDS: ${{ needs.plan.outputs.n }}
