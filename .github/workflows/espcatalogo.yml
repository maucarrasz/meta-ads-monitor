name: espcatalogo
on:
  schedule:
    # Catalogo + ranking del espia personal ECOM (Shopify publico, sin Meta). Idempotente: retoma lo no leido hoy.
    - cron: "0 17 * * *"    # 12:00 Lima
    - cron: "35 18 * * *"   # 13:35 Lima (respaldo)
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: espcatalogo-personal
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277394231713/locations/global/workloadIdentityPools/github-meta-ads/providers/github-actions
          service_account: meta-ads-robot@mauricio-ai-hub.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install google-api-python-client google-auth
      - run: python espcat.py
