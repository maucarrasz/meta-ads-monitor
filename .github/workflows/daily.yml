name: daily
on:
  schedule:
    - cron: "30 12 * * *"   # 07:30 Lima; una corrida all, fin duro 12:00 Lima
  workflow_dispatch:
concurrency:
  group: mini-sniper-meta-daily
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277394231713/locations/global/workloadIdentityPools/github-meta-ads/providers/github-actions
          service_account: meta-ads-robot@mauricio-ai-hub.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright google-api-python-client google-auth
      - run: python -m playwright install --with-deps chromium
      - run: python main.py
        env:
          SHEET_ID: 1ksNMiSje9A94SdYWDrCGRI-4Obkuqvgqftf3oauYqM0
          MAX_STORES: ${{ vars.MAX_STORES || '500' }}
          INGESTA_TAB: ${{ vars.INGESTA_TAB || 'Ingesta_Diaria' }}
          SHARD: all
