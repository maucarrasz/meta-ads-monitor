name: daily
on:
  schedule:
    - cron: "0 14 * * *"    # robot 0, 09:00 hora Peru
    - cron: "15 15 * * *"   # robot 1, 10:15 hora Peru
    - cron: "30 16 * * *"   # robot 2, 11:30 hora Peru
    - cron: "45 17 * * *"   # robot 3, 12:45 hora Peru
  workflow_dispatch:
    inputs:
      shard:
        description: "Robot 0, 1, 2, 3 o all (todas las tiendas)"
        default: "all"
permissions:
  contents: read
  id-token: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277394231713/locations/global/workloadIdentityPools/github-meta-ads/providers/github-actions
          service_account: meta-ads-robot@mauricio-ai-hub.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright google-api-python-client google-auth
      - run: python -m playwright install --with-deps chromium
      - run: python main.py
        env:
          SHEET_ID: 1ksNMiSje9A94SdYWDrCGRI-4Obkuqvgqftf3oauYqM0
          MAX_STORES: ${{ vars.MAX_STORES || '55' }}
          INGESTA_TAB: ${{ vars.INGESTA_TAB || 'Ingesta_Diaria' }}
          SHARD: ${{ github.event.inputs.shard || (github.event.schedule == '0 14 * * *' && '0') || (github.event.schedule == '15 15 * * *' && '1') || (github.event.schedule == '30 16 * * *' && '2') || '3' }}
