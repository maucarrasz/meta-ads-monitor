name: daily
on:
  schedule:
    - cron: "17 8 * * *"    # 03:17 Lima (principal)
    - cron: "13 12 * * *"   # 07:13 Lima: unico respaldo, solo corre si hoy no hay run exitoso/en curso/en cola
  workflow_dispatch:
    inputs:
      shard:
        description: "Robot 0, 1, 2, 3 o all (todas las tiendas)"
        default: "all"
      hasta:
        description: "Hora Lima de corte (defecto 20). Solo excepcion del dia"
        default: ""
      solo_lista:
        description: "1 = solo imprimir la lista de tiendas (sin Facebook)"
        default: ""
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      nshards: ${{ steps.p.outputs.nshards }}
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - id: gate
        name: Respaldo solo si hoy no hay run del daily
        env:
          GH_TOKEN: ${{ github.token }}
          SCHED: ${{ github.event.schedule }}
        run: |
          skip=false
          if [ "$SCHED" = "13 12 * * *" ]; then
            day=$(date -u -d '5 hours ago' +%F); since="${day}T05:00:00Z"
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/daily.yml/runs?per_page=50&created=>=${since}" --jq "[.workflow_runs[]|select(.id!=${{ github.run_id }})|select(.conclusion==null or .conclusion==\"success\")]|length")
            echo "RESPALDO runs_hoy_validos=$n desde=$since"
            [ "${n:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip != 'true'
      - uses: google-github-actions/auth@v2
        if: steps.gate.outputs.skip != 'true'
        with:
          workload_identity_provider: projects/277394231713/locations/global/workloadIdentityPools/github-meta-ads/providers/github-actions
          service_account: meta-ads-robot@mauricio-ai-hub.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with: { python-version: "3.12" }
      - run: pip install google-api-python-client google-auth playwright
        if: steps.gate.outputs.skip != 'true'
      - id: p
        if: steps.gate.outputs.skip != 'true'
        run: python plan.py
  run:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(github.event.inputs.shard && format('["{0}"]', github.event.inputs.shard) || needs.plan.outputs.shards) }}
    concurrency:
      group: minisniper-ads-${{ matrix.shard }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/277394231713/locations/global/workloadIdentityPools/github-meta-ads/providers/github-actions
          service_account: meta-ads-robot@mauricio-ai-hub.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright google-api-python-client google-auth
      - run: python -m playwright install --with-deps chromium
      - run: python main.py
        env:
          SHEET_ID: 1ksNMiSje9A94SdYWDrCGRI-4Obkuqvgqftf3oauYqM0
          MAX_STORES: ${{ vars.MAX_STORES || '500' }}
          INGESTA_TAB: ${{ vars.INGESTA_TAB || 'Ingesta_Diaria' }}
          SHARD: ${{ matrix.shard }}
          NSHARDS: ${{ needs.plan.outputs.nshards }}
          SOLO_LISTA: ${{ github.event.inputs.solo_lista }}
          DAILY_HASTA: ${{ github.event.inputs.hasta }}
