name: ai-apps-cierre
on:
  schedule:
    - cron: '9,39 * * * *'
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
concurrency:
  group: ai-apps-cierre
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@v2
        with:
          project_id: mauricio-ai-hub
          workload_identity_provider: projects/277394231713/locations/global/workloadIdentityPools/github-meta-ads/providers/github-actions
          service_account: meta-ads-robot@mauricio-ai-hub.iam.gserviceaccount.com
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install google-api-python-client google-auth
      - name: Process AI APPS close-out queue shard
        env:
          CHANNELS_SHEET_ID: ${{ vars.CHANNELS_SHEET_ID }}
          SHARD: ${{ matrix.shard }}
          NSHARDS: "4"
        run: python ai-apps-cierre/cola_cierre.py
