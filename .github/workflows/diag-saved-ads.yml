name: Diag saved product Ads
on:
  workflow_dispatch:
    inputs:
      phrases:
        description: "dominio/products/handle separados por coma"
        required: true
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: requirements-worker.lock }
      - run: pip install --require-hashes -r requirements-worker.lock
      - run: python diag_saved_ads.py
        env: { PHRASES: "${{ github.event.inputs.phrases }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag, path: diag }
